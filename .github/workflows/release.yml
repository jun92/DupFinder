name: Build and Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 10.0.x

    - name: Publish App
      run: dotnet publish DupFinder/DupFinder.csproj -c Release -o publish

    - name: Zip output
      run: Compress-Archive -Path publish\* -DestinationPath DupFinder.zip

    - name: Release
      uses: softprops/action-gh-release@v1
      with:
        files: DupFinder.zip
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
